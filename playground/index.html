<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Block Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: a working bench. Top bar of switches, a 16:9 world view on the left, the 9:16 street cam on the right. */
:root {
  --bg: #e7e6e3;
  --panel: #f4f3f1;
  --ink: #18181a;
  --muted: #6b6a70;
  --line: #cfcdc9;
  --accent: #ea3383;
  --chip: #ffffff;
  --display: "Space Grotesk", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --panel: #1a1a1d; --ink: #ecebe8; --muted: #9a99a0;
    --line: #2c2c31; --accent: #ff5aa0; --chip: #232327; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111113; --panel: #1a1a1d; --ink: #ecebe8; --muted: #9a99a0;
  --line: #2c2c31; --accent: #ff5aa0; --chip: #232327; color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: #1f1f1f; color: var(--ink); font-family: var(--mono); font-size: 12px;
  display: flex; flex-direction: row; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box; gap: 12px;
}
button, select {
  font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd { font: inherit; color: var(--muted); }
main { flex: 1; min-width: 0; min-height: 0; display: flex; gap: 12px; justify-content: center; align-items: center; }
#side { width: calc(264px + max(16px, env(safe-area-inset-left, 0px))); flex: none; display: flex; flex-direction: column;
  margin: -12px 0 -12px calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }   /* bleed to the left/top/bottom edges — full-height sidebar */
.view { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); flex: none; }
.view canvas { display: block; width: 100%; height: 100%; }
.tag {
  position: absolute; left: 10px; top: 10px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--chip); color: var(--ink); border: 1px solid var(--line); padding: 3px 7px; border-radius: 4px; pointer-events: none;
}
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.phrase {
  position: absolute; left: 0; top: 0; white-space: nowrap; font-family: var(--mono); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px; line-height: 1; padding: 4px 6px 3px;
  transform-origin: 0 100%; will-change: transform, opacity;
}
#streetWrap .phrase { font-size: 8px; padding: 3px 4px 2px; }
#guiHost { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
#guiHost::-webkit-scrollbar { display: none; }
#guiHost .lil-gui { --width: 100%; }
#side { border-right: 1px solid #424242; }   /* same gray line lil-gui draws above/below folder titles */
#showBtn { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); z-index: 20; opacity: 0.35; }
#showBtn:hover, #showBtn:focus-visible { opacity: 1; }
body.bare .chrome { display: none !important; }
@media (max-width: 760px) {
  body { overflow: auto; height: auto; flex-direction: column; }
  #side { width: 100%; margin: 0; max-height: 45vh; }
  main { flex-direction: column; align-items: center; }
  #mainWrap { width: 100% !important; height: auto !important; aspect-ratio: 16 / 9; }
  #streetWrap { width: min(100%, 60vh * 0.5625) !important; height: auto !important; aspect-ratio: 9 / 16; }
  #guiHost { display: none; }
}
</style>
</head>
<body>

<aside id="side" class="chrome">
  <div id="guiHost"></div>
</aside>
<button id="showBtn" hidden>Show controls</button>

<main>
  <div class="view" id="mainWrap">
    <canvas id="mainCanvas" aria-label="Living city block, world view"></canvas>
    <div class="labels" id="mainLabels"></div>
    <div class="tag chrome" id="mainTag">World · isometric · 16:9</div>

  </div>
  <div class="view" id="streetWrap">
    <canvas id="streetCanvas" aria-label="Street camera view, 9 by 16"></canvas>
    <div class="labels" id="streetLabels"></div>
  </div>
</main>
