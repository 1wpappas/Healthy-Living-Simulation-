<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cone guys</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; font: 13px/1.4 ui-monospace, Menlo, monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
// Loads cone-guys-all.glb and shows it with orbit controls, using the model's own materials.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#ffffff');
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100); cam.position.set(0, 2.6, 9.5);
const controls = new OrbitControls(cam, renderer.domElement); controls.target.set(0, 1.1, 0); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight('#ffffff', '#cfcfcf', 1.6)); const sun = new THREE.DirectionalLight('#ffffff', 1.8); sun.position.set(3, 6, 5); scene.add(sun);
new GLTFLoader().load('cone-guys-all.glb', (g) => { scene.add(g.scene); });
function resize() { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, cam); });
</script>
</body>
</html>
