// dial-kit colours: mutate the shared palette objects in place so every guy, path and tag picks them up live

/* ───────────── projection ───────────── */
const proj = (x, y, z = 0) => [OX + (x - y) * C30, OY + (x + y) * 0.5 - z];
const unproj = (sx, sy) => { const a = (sx - OX) / C30, b = (sy - OY) * 2; return [(a + b) / 2, (b - a) / 2]; };

/* ───────────── colour: opaque mix with the white ground ───────────── */
const rgbCache = {};
function hexRgb(h) { return rgbCache[h] || (rgbCache[h] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16))); }
function onWhite(hex, a) {
  const [r, g, b] = hexRgb(hex); a = Math.max(0, Math.min(1, a));
  return `rgb(${255 + (r - 255) * a | 0},${255 + (g - 255) * a | 0},${255 + (b - 255) * a | 0})`;
}

/* ───────────── utilities ───────────── */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * t);
function hull(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function rot(v, a, th) { // Rodrigues, unit axis a
  const c = Math.cos(th), s = Math.sin(th), d = a[0] * v[0] + a[1] * v[1] + a[2] * v[2];
  const x = [a[1] * v[2] - a[2] * v[1], a[2] * v[0] - a[0] * v[2], a[0] * v[1] - a[1] * v[0]];
  return [0, 1, 2].map(i => v[i] * c + x[i] * s + a[i] * d * (1 - c));
}

let view = { x0: 0, y0: 0, x1: FW, y1: FH };
const TEXT_RECT = [420, 480, 1760, 790];   // logo + two-line headline, padded
const CORNER_W = 0.3, CORNER_H = 0.34;      // each corner of the view (as a share of it) belongs to the peripheral paths
function cornerRects() {
  const w = view.x1 - view.x0, h = view.y1 - view.y0, cw = w * CORNER_W, ch = h * CORNER_H;
  return [[view.x0, view.y0, view.x0 + cw, view.y0 + ch], [view.x1 - cw, view.y0, view.x1, view.y0 + ch],
          [view.x0, view.y1 - ch, view.x0 + cw, view.y1], [view.x1 - cw, view.y1 - ch, view.x1, view.y1]];
}
const overlap = (r, q) => r[2] > q[0] && r[0] < q[2] && r[3] > q[1] && r[1] < q[3] ? Math.min(r[2] - q[0], q[2] - r[0], r[3] - q[1], q[3] - r[1]) : 0;
function badness(i, j) {        // 0 = fine; otherwise how far off-screen / into the headline
  const [px, py] = proj(i * S, j * S);
  let b = Math.max(0, view.x0 + 150 - px) + Math.max(0, px - (view.x1 - 150)) + Math.max(0, view.y0 + 260 - py) + Math.max(0, py - (view.y1 - 70));
  const r = [px - 80 * CS, py - 250 * CS, px + 80 * CS, py + 50 * CS];
  b += overlap(r, TEXT_RECT);
  for (const q of cornerRects()) b += overlap(r, q);         // tucked in toward the middle, clear of the corner paths
  return b;
}
const cellOK = (i, j) => badness(i, j) === 0;

/* ───────────── characters ───────────── */
const chars = [];
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const cheb = (r, i, j) => Math.max(Math.abs(r[0] - i), Math.abs(r[1] - j));
const SPACE = 3;                // cells kept between characters while wandering
function nearest(i, j, self) {
  let m = Infinity;
  for (const o of chars) if (o !== self) for (const r of o.res) m = Math.min(m, cheb(r, i, j));
  return m;
}
// keep 3 cells apart; anyone already crowded (e.g. just out of the line) may move as long as it doesn't squeeze closer
function free(i, j, self) {
  const dn = nearest(i, j, self);
  if (dn >= SPACE) return true;
  if (!self) return false;
  if (i === self.i && j === self.j) return true;            // shuffling within its own cell is always fine
  const cur = nearest(self.i, self.j, self);
  return cur >= SPACE ? false : dn > 0 && dn >= cur;
}

  const V = [view.x0, view.y0, view.x1, view.y1];
  for (let i = PERI.length - 1; i >= 0; i--) {
    const q = PERI[i]; q.t += dt;
    // the rider makes its path: the ribbon is laid behind it, lingers once it's gone, then lifts away from the start
    if (q.state === 'draw') {
      const [ra, rb] = visRange(q.path, proj, V, 230);
      q.state = 'roll'; q.s = ra; q.s1 = rb; q.tail = ra; q.head = ra; q.c.px = null; q.c.hx = null; q.c.lfx = null; periPlace(q, ra);
    } else if (q.state === 'roll') {
      q.s += ROLL_SPEED * dt; periPlace(q, Math.min(q.s, q.s1)); q.head = Math.min(q.s, q.s1);
      if (q.s >= q.s1) { q.state = 'linger'; q.hold = 1.6; }
    } else if (q.state === 'linger' && (q.hold -= dt) <= 0) q.state = 'lift';
    else if (q.state === 'lift') { q.tail += ROLL_SPEED * 1.6 * dt; if (q.tail >= q.head) { PERI.splice(i, 1); continue; } }
    const c = q.c, ft = Math.max(-1, Math.min(1, (Math.cos(c.hd) - Math.sin(c.hd)) * 0.9));
    c.face += (ft - c.face) * Math.min(1, dt * 7);
  }
}
function periPlace(q, s) {                           // put a corner path's roller at arc length s (scene-2 ground)
  const c = q.c, [x, y] = pathSample(q.path, s).pt;
  const d = c.px == null ? 0 : Math.hypot(x - c.x, y - c.y);
  if (d > 1e-3) { c.hd = Math.atan2(y - c.y, x - c.x); c.rollA += d / (SPHERE_R * CS); }
  c.sp = d; c.x = x; c.y = y; c.px = 1;
}
const periRollers = () => PERI.filter(q => q.state === 'roll').map(q => q.c);
function drawPeri(g) {
  for (const q of PERI) { g.fillStyle = HEAD_PAL[q.set].f; drawRibbon(g, q.path, q.tail, q.head, RIB2, proj); }
}

/* ───────────── scroll: the intro slides away and the world comes up ───────────── */
const scene1 = document.getElementById('scene1'), scene2 = document.getElementById('scene2');
let page = 0, pT = 0, pFrom = 0, pAt = -9, lockUntil = 0;
function goPage(n) { if (n === page || now() < lockUntil) return; pFrom = pT; page = n; pAt = now(); lockUntil = now() + 1.3; }
addEventListener('wheel', e => { if (e.target.closest && e.target.closest('.lil-gui')) return;   // scrolling the dial kit doesn't flip the page
  if (Math.abs(e.deltaY) > 3) goPage(e.deltaY > 0 ? 1 : 0); }, { passive: true });
addEventListener('keydown', e => {
  if (['ArrowDown', 'PageDown', ' '].includes(e.key)) goPage(1);
  if (['ArrowUp', 'PageUp'].includes(e.key)) goPage(0);
});
let touchY = null;
addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
addEventListener('touchend', e => { if (touchY === null) return; const dy = touchY - e.changedTouches[0].clientY; if (Math.abs(dy) > 40) goPage(dy > 0 ? 1 : 0); touchY = null; }, { passive: true });
function updatePage() {
  const u = Math.min(1, (now() - pAt) / 1.15);
  pT = pFrom + (page - pFrom) * easeInOutCubic(u);
  scene1.style.transform = `translateY(${-pT * 100}vh)`;
  scene2.style.transform = `translateY(${(1 - pT) * 100}vh)`;
  if (!periOn && pT >= 1) { periOn = true; periNext = 0.5; }   // first arrival: the corners start drawing now
}

resize(); resizeIntro(); seed();
// warm up so the world opens mid-stride, traces already laid
for (let k = 0; k < 60 * 7; k++) { step(1 / 60); for (const c of chars) { const an = bodyAnchor(c); springOnly(c, an, 1 / 60); } }
function bodyAnchor(c) { ctx.save(); ctx.globalAlpha = 0; const an = drawBody(ctx, c); ctx.restore(); return an; }
function springOnly(c, an, dt) { ctx.save(); ctx.globalAlpha = 0; drawHead(ctx, c, an, dt); ctx.restore(); }

const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (still) for (let k = 0; k < 60 * 40; k++) updateIntro(1 / 60);   // no motion: open on the finished intro
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!still) { step(dt); updateIntro(dt); }
  updatePage();
  renderIntro(still ? 0 : dt);
  render(still ? 0 : dt);
  requestAnimationFrame(frame);
}
document.fonts.ready.then(() => requestAnimationFrame(frame));
</script>
</body>
