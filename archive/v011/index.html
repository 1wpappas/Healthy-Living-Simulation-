<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Archived playground v0.11: a verbatim copy of playground/index.html as committed in

     note and ?preset=sketch|night|hero deep links. Do not edit; the live playground is ../playground/index.html. -->
<title>Living Block Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: a working bench. Top bar of switches, a 16:9 world view on the left, the 9:16 street cam on the right. */
:root {
  --bg: #e7e6e3;
  --panel: #f4f3f1;
  --ink: #18181a;
  --muted: #6b6a70;
  --line: #cfcdc9;
  --accent: #ea3383;
  --chip: #ffffff;
  --display: "Space Grotesk", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --panel: #1a1a1d; --ink: #ecebe8; --muted: #9a99a0;
    --line: #2c2c31; --accent: #ff5aa0; --chip: #232327; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111113; --panel: #1a1a1d; --ink: #ecebe8; --muted: #9a99a0;
  --line: #2c2c31; --accent: #ff5aa0; --chip: #232327; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 12px;
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box; gap: 12px;
}
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
header h1 { font-family: var(--display); font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
header .ver { color: var(--muted); }
.group { display: flex; gap: 4px; align-items: center; }
.group span { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; margin-right: 4px; }
.spacer { flex: 1; }
button, select {
  font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd { font: inherit; color: var(--muted); }
main { flex: 1; min-height: 0; display: flex; gap: 12px; justify-content: center; align-items: center; }
.view { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); flex: none; }
.view canvas { display: block; width: 100%; height: 100%; }
.tag {
  position: absolute; left: 10px; top: 10px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--chip); color: var(--ink); border: 1px solid var(--line); padding: 3px 7px; border-radius: 4px; pointer-events: none;
}
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.phrase {
  position: absolute; left: 0; top: 0; white-space: nowrap; font-family: var(--mono); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.05em; font-size: 13px; line-height: 1; padding: 5px 7px 4px;
  transform-origin: 0 100%; will-change: transform, opacity;
}
#streetWrap .phrase { font-size: 10px; padding: 4px 5px 3px; }
.cctv { position: absolute; inset: 0; pointer-events: none; color: #fff; font-size: 11px; text-shadow: 0 1px 2px #0008; }
.cctv .tl { position: absolute; left: 12px; top: 12px; }
.cctv .br { position: absolute; right: 12px; bottom: 12px; font-variant-numeric: tabular-nums; }
.cctv .rec { color: #ff4a4a; }
.legend { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
  background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; pointer-events: none; max-width: calc(100% - 20px); }
.legend i { display: inline-block; width: 12px; height: 8px; margin-right: 5px; vertical-align: -1px; }
#guiHost { position: absolute; left: 10px; bottom: 10px; max-height: calc(100% - 50px); overflow: auto; }
#guiHost .lil-gui { --width: 250px; }
#showBtn { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); z-index: 20; opacity: 0.35; }
#showBtn:hover, #showBtn:focus-visible { opacity: 1; }
body.bare header, body.bare .chrome { display: none !important; }
@media (max-width: 760px) {
  body { overflow: auto; height: auto; }
  main { flex-direction: column; align-items: center; }
  #mainWrap { width: 100% !important; height: auto !important; aspect-ratio: 16 / 9; }
  #streetWrap { width: min(100%, 60vh * 0.5625) !important; height: auto !important; aspect-ratio: 9 / 16; }
  #guiHost { display: none; }
  .legend { display: none; }
}
</style>
</head>
<body>

<header>
  <h1>Living Block <span class="ver" id="verLabel">v0.11</span></h1>
  <div class="group" role="group" aria-label="World view">
    <span>View</span>
    <button id="btnIso" aria-pressed="true">Isometric</button>
    <button id="btnTop" aria-pressed="false">Top-down</button>
    <button id="btnFish" aria-pressed="false" title="Bend the world view like a fisheye lens (tune it under Tweak, World fisheye)">Fisheye</button>
  </div>
  <div class="group">
    <span>Version</span>
    <select id="preset" aria-label="Version">
      <option value="sketch">v0.11 · Sketch (your colors)</option>
      <option value="night">v0.11b · Night (murmur-ish)</option>
      <option value="hero">v0.11c · Hero (stamp trails)</option>
    </select>
  </div>
  <div class="group">
    <span>World</span>
    <select id="worldSel" aria-label="World">
      <option value="subway">Subway map (45° lines)</option>
      <option value="roads">Roads (flat, colour routes)</option>
      <option value="block">Block (3D towers)</option>
    </select>
  </div>
  <div class="group" id="lookGroup">
    <span>Heads</span>
    <button id="btnSoft" aria-pressed="true">Soft 3D</button><button id="btnCel" aria-pressed="false">Cel</button>
  </div>
  <div class="group">
    <span>Cast</span>
    <select id="castSel" aria-label="Cast">
      <option value="blocks">Blocks (cube, cones, sphere) · saved</option>
      <option value="heads">Heads (3D, in wire balls)</option>
      <option value="orbits">Orbits (fluid + rope) · saved</option>
    </select>
  </div>
  <div class="group">
    <span>Trail</span>
    <select id="trailSel" aria-label="Trail style">
      <option value="lines">Lines + nodes</option>
      <option value="dots">Dots (murmur)</option>
      <option value="stamps">Stamps</option>
      <option value="off">Off (no trails)</option>
    </select>
  </div>
  <div class="group" role="group" aria-label="Street cam position">
    <span>Street cam</span>
    <button id="camCorner" aria-pressed="true">Corner</button>
    <button id="camHigh" aria-pressed="false">High</button>
    <button id="camFar" aria-pressed="false">Far</button>
  </div>
  <div class="group">
    <button id="btnPause" aria-pressed="false">Pause</button>
    <button id="btnClear">Clear trails</button>
    <button id="btnPhrases" aria-pressed="false" title="Hover a character to see what it is doing. This adds random pop-ups too.">Auto phrases</button>
  </div>
  <div class="spacer"></div>
  <button id="btnHide">Hide controls <kbd>H</kbd></button>
</header>
<button id="showBtn" hidden>Show controls</button>

<main>
  <div class="view" id="mainWrap">
    <canvas id="mainCanvas" aria-label="Living city block, world view"></canvas>
    <div class="labels" id="mainLabels"></div>
    <div class="tag chrome" id="mainTag">World · isometric · 16:9</div>
    <div class="legend chrome" id="legend">
      <span><i style="background:#ea3383;box-shadow:inset 0 -3px #f5c2f9"></i>Cube rolls · hops · slides</span>
      <span><i style="background:#459af6;box-shadow:inset 0 -3px #72f5e4"></i>Blue cone hops · pivots</span>
      <span><i style="background:#d79d36;box-shadow:inset 0 -3px #fef863"></i>Gold cone hops · pivots</span>
      <span><i style="background:#54b642;box-shadow:inset 0 -3px #75fb81"></i>Sphere rolls · bumps</span>
    </div>
    <div id="guiHost" class="chrome"></div>
  </div>
  <div class="view" id="streetWrap">
    <canvas id="streetCanvas" aria-label="Street camera view, 9 by 16"></canvas>
    <div class="labels" id="streetLabels"></div>
    <div class="cctv">
      <div class="tl"><span class="rec">● REC</span>&nbsp; CAM 03 · CORNER</div>
      <div class="br" id="clock">00:00:00</div>
    </div>
  </div>
</main>

{ const was = phrasesOn; phrasesOn = false; for (let i = 0; i < 240; i++) { simTime += 1 / 60; for (const a of agents) a.update(1 / 60, simTime); } phrasesOn = was; }
agents.forEach(a => a.quietUntil = simTime + rand(0.5, 6));
const CAMS = [[ortho, mainWrap, (x, y) => S.mainFish ? mainWarp(x, y) : [x, y]], [persp, streetWrap, fisheyeWarp]];
// Hover a character to hear what it's doing: its phrase shows for as long as the pointer stays on it
let hover = null;
function pickAgent(e, ci) {
  const [cam, wrap, warp] = CAMS[ci], r = wrap.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 42;
  for (const a of agents) for (const p of [a.head.position, a.body.position]) {
    proj.copy(p).project(cam); if (proj.z > 1) continue;
    if (warp) { const q = warp(proj.x, proj.y); proj.x = q[0]; proj.y = q[1]; }
    const d = Math.hypot((proj.x * 0.5 + 0.5) * r.width - mx, (-proj.y * 0.5 + 0.5) * r.height - my);
    if (d < bd) { bd = d; best = a; }
  }
  return best;
}
[mainWrap, streetWrap].forEach((wrap, ci) => {

  wrap.addEventListener('pointerleave', () => { hover = null; wrap.style.cursor = ''; });
});
function keepHover(now) {
  if (!hover || !agents.includes(hover)) return;

}
function frame() {

  updateTrails(simTime); updateStamps(simTime);
  for (const a of agents) if (a.ribbon) a.ribbon.update(simTime, S.trailLife * 0.3);
  const k = 1 - Math.exp(-dt * 4); viewNow.el += (viewGoal.el - viewNow.el) * k; viewNow.az += (viewGoal.az - viewNow.az) * k; placeOrtho();
  for (const a of agents) { a.glow.visible = nightOn; a.shadow.visible = !nightOn;
    if (nightOn) { a.glow.position.set(a.shadow.position.x, 0.009, a.shadow.position.z); a.glow.material.opacity = S.charGlow * 0.9 / (1 + Math.max(0, a.head.position.y - 1.2)); } }
  trailMat.resolution.copy(mainSize); trailMat.linewidth = S.trailWidth; fatMats.forEach(m => { m.resolution.copy(mainSize); m.linewidth = m.userData.w; }); mainComposer.render();
  const t = performance.now() / 1000, sway = Math.sin(t * 0.25) * 0.35 * S.camSway;
  const goal = STREET_CAMS[camKey], kc = 1 - Math.exp(-dt * 3);

  persp.position.copy(camNow.pos); persp.lookAt(camNow.look.x + sway * 3, camNow.look.y, camNow.look.z + sway); persp.updateMatrixWorld();
  trailMat.resolution.copy(streetSize); trailMat.linewidth = S.trailWidth * 1.4; fatMats.forEach(m => { m.resolution.copy(streetSize); m.linewidth = m.worldUnits ? m.userData.w : m.userData.w * 1.4; }); composer.render();
  keepHover(simTime); placePhrases(simTime, CAMS);
  const sec = Math.floor(simTime) + 8 * 3600 + 41 * 60; clockEl.textContent = [sec / 3600, (sec / 60) % 60, sec % 60].map(n => String(Math.floor(n)).padStart(2, '0')).join(':');
  requestAnimationFrame(frame);
}
